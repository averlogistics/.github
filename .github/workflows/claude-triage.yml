name: Claude triage

# Diagnoses an issue against this repository's real code and ends with a
# verdict: agent-ready, or needs-human. Never neither.
#
# All the logic lives in averlogistics/workflows. The `issues` trigger has to be
# declared here because a reusable workflow cannot subscribe to one itself.
#
# Gated on AGENT_ENABLED: this is the stage that SPENDS — each run is a model
# call reading your code. Filing an issue is bookkeeping and is never gated;
# diagnosing one is judgement, and judgement gets a switch.

on:
  issues:
    types: [labeled]

jobs:
  triage:
    if: vars.AGENT_ENABLED == 'true'
    uses: averlogistics/workflows/.github/workflows/claude-triage.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      AGENT_PAT: ${{ secrets.AGENT_PAT }}
